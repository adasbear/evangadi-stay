<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleForm</title>
</head>
<body>
    <h1>Add iPhone</h1>
    <form action="http://localhost:3001/addiphone" method="post">
        <!-- iPhoneID -->
        <label for="iPhoneId">iPhone ID: </label><br>
        <input type="text" name="iPhoneId"><br><br>

        <!-- iPhone Image Path -->
        <label for="imgPath">iPhone image path: </label><br>
        <input type="text" name="imgPath" ><br><br>

        <!-- iPhone Page Link -->
         <label for="pageLink">iPhone Page Link: </label><br>
         <input type="text" name="pageLink"> <br><br>

         <button type="submit">Submit</button>
    </form>
</body>
</html>
